<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - Sukoon Live Tracking</title>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { 
            background: #0f0f0f; color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 15px; margin: 0;
        }
        
        /* Dashboard Cards */
        .dashboard { 
            background: #1e1e1e; padding: 20px; 
            border-radius: 12px; margin-bottom: 20px; 
            border: 1px solid #333; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        h2 { color: #d4af37; text-align: center; margin-top: 10px; margin-bottom: 20px; font-weight: 800; letter-spacing: 1px;}
        h3 { color: #8ab4f8; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px; }
        
        /* Live Indicator */
        .live-indicator { 
            display: inline-block; width: 12px; height: 12px; 
            background: #ff4757; border-radius: 50%; 
            box-shadow: 0 0 10px #ff4757; animation: blink 1s infinite alternate; 
            margin-right: 10px; vertical-align: middle;
        }
        @keyframes blink { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        /* Status Row */
        .status-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 0; border-bottom: 1px solid #2a2a2a; font-size: 16px; 
        }
        .status-row:last-child { border-bottom: none; }
        .live-value { font-weight: bold; color: #2ecc71; font-family: monospace; font-size: 18px; }
        
        /* Upload Inputs */
        .upload-row { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { margin-bottom: 5px; color: #aaa; font-size: 13px; font-weight: bold; }
        input[type="file"], input[type="text"] { 
            background: #2a2a2a; color: white; padding: 12px; 
            border-radius: 8px; border: 1px solid #444; width: 100%; box-sizing: border-box; 
        }
        
        /* Buttons */
        button { 
            background: #333; color: white; border: none; 
            padding: 15px; font-size: 16px; border-radius: 8px; 
            margin: 5px 0; width: 100%; cursor: pointer; font-weight: bold; 
            transition: all 0.2s; 
        }
        button:active { transform: scale(0.98); }
        .primary-btn { background: linear-gradient(45deg, #d4af37, #ffdf00); color: #111; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .danger-btn { background: linear-gradient(45deg, #ff4757, #ff6b81); color: white; box-shadow: 0 0 10px rgba(255, 71, 87, 0.3); }
        .action-btn { background: #3498db; }

        /* Timer */
        #timer-display { 
            font-size: 32px; color: #2ecc71; text-align: center; 
            margin: 15px 0; font-family: monospace; font-weight: bold; 
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
        }
    </style>
</head>
<body>

    <h2><span class="live-indicator"></span>SUKOON ADMIN LIVE</h2>
    
    <!-- 1. LIVE TRACKING DASHBOARD -->
    <div class="dashboard">
        <h3>Live Zero-Delay Report</h3>
        <div class="status-row">
            <span>Her Current Screen:</span>
            <span id="current-screen" class="live-value" style="color: #f39c12;">Waiting for her...</span>
        </div>
        <div class="status-row">
            <span>Dino Score (Letters):</span>
            <span id="current-score" class="live-value">0 / 17</span>
        </div>
    </div>

    <!-- 2. QUOTES & AESTHETIC PANEL -->
    <div class="dashboard">
        <h3>Quotes Page: Visuals & Music</h3>
        <p style="font-size: 12px; color: #888; margin-bottom: 15px;">Auto-compresses images for zero-lag Firebase sync.</p>
        
        <div class="upload-row">
            <label>Page 1 Image (Rare Spark)</label>
            <input type="file" accept="image/*" onchange="uploadImage(event, 'pic1')">
        </div>
        <div class="upload-row">
            <label>Page 2 Image (Beautiful Chaos)</label>
            <input type="file" accept="image/*" onchange="uploadImage(event, 'pic2')">
        </div>
        <div class="upload-row">
            <label>Page 3 Image (11:11)</label>
            <input type="file" accept="image/*" onchange="uploadImage(event, 'pic3')">
        </div>

        <div class="upload-row" style="margin-top: 15px;">
            <label>Aesthetic Song URL (Direct MP3 Link)</label>
            <input type="text" id="song-url" placeholder="Paste .mp3 link here" onchange="updateSongUrl()">
        </div>
        
        <!-- Music Timer -->
        <div id="timer-display">00:00</div>
        
        <button class="primary-btn" onclick="playQuotesMusic()">▶ PLAY MUSIC (Starts Quotes Song)</button>
        <button class="danger-btn" onclick="stopQuotesMusic()">⏸ STOP MUSIC</button>
    </div>

    <!-- 3. DINO GAME OVERRIDE CONTROLS -->
    <div class="dashboard">
        <h3>Dino Game: Secret Controls</h3>
        <button onclick="sendDinoCommand('start')" class="action-btn">Force Start Game (If stuck)</button>
        <button onclick="sendDinoCommand('trigger_birthday')" class="primary-btn">Direct Skip to 17 Cake</button>
        <button onclick="sendDinoCommand('reset')" class="danger-btn">Force Reload Her Page</button>
    </div>

    <script>
        // ---------------- FIREBASE SETUP ---------------- //
        const firebaseConfig = {
            databaseURL: "https://sukoon11-default-rtdb.firebaseio.com/",
            projectId: "sukoon11"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ---------------- 1. LIVE TRACKING SYSTEM ---------------- //
        // Listens to Dino Game State continuously
        db.ref('birthday2026/liveState').on('value', (snap) => {
            const data = snap.val();
            if (data) {
                const screenEl = document.getElementById('current-screen');
                screenEl.innerText = data.screen;
                
                // Color Code her activity
                if(data.screen.includes("Crashed") || data.screen.includes("Game Over")) {
                    screenEl.style.color = "#ff4757"; // Red for out
                } else if(data.screen.includes("Birthday")) {
                    screenEl.style.color = "#d4af37"; // Gold for cake
                } else {
                    screenEl.style.color = "#2ecc71"; // Green for playing
                }

                document.getElementById('current-score').innerText = `${data.score} / ${data.total}`;
            }
        });

        // Track if she is on the Quotes Page
        db.ref('birthday2026/liveQuotesState').on('value', (snap) => {
            const state = snap.val();
            if (state) {
                document.getElementById('current-screen').innerText = state;
                document.getElementById('current-screen').style.color = "#8ab4f8";
            }
        });

        // ---------------- 2. IMAGE COMPRESSOR & UPLOADER ---------------- //
        function uploadImage(event, picKey) {
            const file = event.target.files[0];
            if(!file) return;

            // UI Feedback
            event.target.style.borderColor = "#f39c12";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_HEIGHT = 1000; // Resize to max 1000px height for fast load
                    let width = img.width;
                    let height = img.height;

                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to 60% quality JPEG
                    const base64Data = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    // Push to Firebase Quotes DB
                    db.ref('birthday2026/quotesData/' + picKey).set(base64Data)
                      .then(() => {
                          event.target.style.borderColor = "#2ecc71"; // Green on success
                          alert(`Success! ${picKey} synced live to her phone.`);
                      })
                      .catch(err => alert("Upload failed: " + err.message));
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // ---------------- 3. MUSIC & TIMER CONTROLS ---------------- //
        function updateSongUrl() {
            const url = document.getElementById('song-url').value;
            db.ref('birthday2026/quotesData/songUrl').set(url)
              .then(() => alert("Song URL pushed successfully!"));
        }

        let timerInterval;
        let seconds = 0;

        function updateTimerDisplay() {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function playQuotesMusic() {
            db.ref('birthday2026/liveCommandQuotes').set('play_music');
            
            // Start Admin Timer
            clearInterval(timerInterval);
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                seconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopQuotesMusic() {
            db.ref('birthday2026/liveCommandQuotes').set('stop_music');
            clearInterval(timerInterval); // Stop timer
        }

        // ---------------- 4. DINO GAME CONTROLS ---------------- //
        function sendDinoCommand(cmd) {
            db.ref('birthday2026/liveCommand').set(cmd).then(() => {
                // Instantly reset command so it doesn't loop infinitely
                setTimeout(() => db.ref('birthday2026/liveCommand').set('idle'), 1500);
            });
        }
    </script>
</body>
              </html>
