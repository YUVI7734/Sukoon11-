<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - Sukoon Live Tracking</title>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { 
            background: #0f0f0f; color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 15px; margin: 0;
        }
        
        .dashboard { 
            background: #1e1e1e; padding: 20px; 
            border-radius: 12px; margin-bottom: 20px; 
            border: 1px solid #333; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        h2 { color: #d4af37; text-align: center; margin-top: 10px; margin-bottom: 20px; font-weight: 800; letter-spacing: 1px;}
        h3 { color: #8ab4f8; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px; }
        
        .live-indicator { 
            display: inline-block; width: 12px; height: 12px; 
            background: #ff4757; border-radius: 50%; 
            box-shadow: 0 0 10px #ff4757; animation: blink 1s infinite alternate; 
            margin-right: 10px; vertical-align: middle;
        }
        @keyframes blink { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .status-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 0; border-bottom: 1px solid #2a2a2a; font-size: 16px; 
        }
        .status-row:last-child { border-bottom: none; }
        .live-value { font-weight: bold; color: #2ecc71; font-family: monospace; font-size: 18px; }
        
        .upload-row { margin-bottom: 15px; }
        .flex-row { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
        label { color: #aaa; font-size: 13px; font-weight: bold; }
        input[type="file"], input[type="text"], input[type="number"] { 
            background: #2a2a2a; color: white; padding: 12px; 
            border-radius: 8px; border: 1px solid #444; width: 100%; box-sizing: border-box; 
        }
        
        button { 
            background: #333; color: white; border: none; 
            padding: 12px; font-size: 15px; border-radius: 8px; 
            cursor: pointer; font-weight: bold; transition: all 0.2s; 
        }
        button:active { transform: scale(0.98); }
        .primary-btn { background: linear-gradient(45deg, #d4af37, #ffdf00); color: #111; width: 100%; margin-top:10px; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .danger-btn { background: linear-gradient(45deg, #ff4757, #ff6b81); color: white; width: 100%; margin-top:10px; }
        .remove-btn { background: #ff4757; color: white; padding: 12px; width: 100px; }
        .action-btn { background: #3498db; width: 100%; margin-top:10px; }
    </style>
</head>
<body>

    <h2><span class="live-indicator"></span>SUKOON ADMIN LIVE</h2>
    
    <!-- 1. LIVE TRACKING -->
    <div class="dashboard">
        <h3>Live Zero-Delay Report</h3>
        <div class="status-row">
            <span>Her Current Screen:</span>
            <span id="current-screen" class="live-value" style="color: #f39c12;">Waiting for her...</span>
        </div>
        <div class="status-row">
            <span>Dino Score (Letters):</span>
            <span id="current-score" class="live-value">0 / 17</span>
        </div>
    </div>

    <!-- 2. QUOTES & AESTHETIC PANEL -->
    <div class="dashboard">
        <h3>Quotes Page: Visuals & Music Control</h3>
        
        <!-- Image Upload & Remove -->
        <div class="upload-row">
            <label>Page 1 Image (Rare Spark)</label>
            <div class="flex-row">
                <input type="file" accept="image/*" onchange="uploadImage(event, 'pic1')">
                <button class="remove-btn" onclick="removeImage('pic1')">🗑 Remove</button>
            </div>
        </div>
        <div class="upload-row">
            <label>Page 2 Image (Beautiful Chaos)</label>
            <div class="flex-row">
                <input type="file" accept="image/*" onchange="uploadImage(event, 'pic2')">
                <button class="remove-btn" onclick="removeImage('pic2')">🗑 Remove</button>
            </div>
        </div>
        <div class="upload-row">
            <label>Page 3 Image (11:11)</label>
            <div class="flex-row">
                <input type="file" accept="image/*" onchange="uploadImage(event, 'pic3')">
                <button class="remove-btn" onclick="removeImage('pic3')">🗑 Remove</button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <!-- Song & Timer Config -->
        <div class="upload-row">
            <label>Aesthetic Song URL (MP3 Link)</label>
            <input type="text" id="song-url" placeholder="Paste .mp3 link here">
        </div>
        
        <div class="upload-row">
            <label>Start Song From (in seconds) - e.g., 45 for 0:45</label>
            <div class="flex-row">
                <input type="number" id="song-start-time" placeholder="0" value="0">
                <button class="action-btn" style="margin-top:0; width: 120px;" onclick="updateSongConfig()">Sync Audio</button>
            </div>
        </div>
        
        <button class="primary-btn" onclick="playQuotesMusic()">▶ PLAY MUSIC (Starts on Her Phone)</button>
        <button class="danger-btn" onclick="stopQuotesMusic()">⏸ STOP MUSIC</button>
    </div>

    <!-- 3. DINO GAME CONTROLS -->
    <div class="dashboard">
        <h3>Dino Game: Secret Controls</h3>
        <button onclick="sendDinoCommand('start')" class="action-btn">Force Start Game (If stuck)</button>
        <button onclick="sendDinoCommand('trigger_birthday')" class="primary-btn">Direct Skip to 17 Cake</button>
        <button onclick="sendDinoCommand('reset')" class="danger-btn">Force Reload Her Page</button>
    </div>

    <script>
        // ---------------- FIREBASE SETUP ---------------- //
        const firebaseConfig = {
            databaseURL: "https://sukoon11-default-rtdb.firebaseio.com/",
            projectId: "sukoon11"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ---------------- 1. LIVE TRACKING ---------------- //
        db.ref('birthday2026/liveState').on('value', (snap) => {
            const data = snap.val();
            if (data) {
                const screenEl = document.getElementById('current-screen');
                screenEl.innerText = data.screen;
                if(data.screen.includes("Crashed") || data.screen.includes("Game Over")) {
                    screenEl.style.color = "#ff4757"; 
                } else if(data.screen.includes("Birthday")) {
                    screenEl.style.color = "#d4af37"; 
                } else {
                    screenEl.style.color = "#2ecc71"; 
                }
                document.getElementById('current-score').innerText = `${data.score} / ${data.total}`;
            }
        });

        db.ref('birthday2026/liveQuotesState').on('value', (snap) => {
            const state = snap.val();
            if (state) {
                document.getElementById('current-screen').innerText = state;
                document.getElementById('current-screen').style.color = "#8ab4f8";
            }
        });

        // ---------------- 2. IMAGE UPLOAD & REMOVE ---------------- //
        function uploadImage(event, picKey) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_HEIGHT = 1000; 
                    let width = img.width;
                    let height = img.height;

                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Data = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    db.ref('birthday2026/quotesData/' + picKey).set(base64Data)
                      .then(() => alert(`Success! ${picKey} synced live to her phone.`))
                      .catch(err => alert("Upload failed: " + err.message));
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // New function to remove images
        function removeImage(picKey) {
            db.ref('birthday2026/quotesData/' + picKey).remove()
              .then(() => alert(`${picKey} removed from her screen!`))
              .catch(err => alert("Failed to remove: " + err.message));
        }

        // ---------------- 3. MUSIC CONFIG & CONTROLS ---------------- //
        function updateSongConfig() {
            const url = document.getElementById('song-url').value;
            const startTime = document.getElementById('song-start-time').value || 0;
            
            if(url) {
                db.ref('birthday2026/quotesData/songUrl').set(url);
            }
            db.ref('birthday2026/quotesData/songStartTime').set(Number(startTime))
              .then(() => alert("Audio link and Start Time Synced!"));
        }

        function playQuotesMusic() {
            db.ref('birthday2026/liveCommandQuotes').set('play_music');
            alert("Play command sent!");
        }

        function stopQuotesMusic() {
            db.ref('birthday2026/liveCommandQuotes').set('stop_music');
        }

        // ---------------- 4. DINO GAME CONTROLS ---------------- //
        function sendDinoCommand(cmd) {
            db.ref('birthday2026/liveCommand').set(cmd).then(() => {
                setTimeout(() => db.ref('birthday2026/liveCommand').set('idle'), 1500);
            });
        }
    </script>
</body>
</html>
